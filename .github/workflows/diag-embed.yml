name: Diagnóstico embeds PostgREST

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diagnosticar embeds
        run: node scripts/diag_embed_queries.mjs
